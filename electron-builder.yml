appId: com.devezio.desknotch
productName: DeskNotch
copyright: Copyright © 2026 Devezio.tech
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
# Updates: `latest.yml` is published beside the installer and the installed
# app reads it (main/updater.ts). Keep appId unchanged, or an update installs
# as a second app.
publish:
  provider: github
  owner: yashsrivasta7a
  repo: deskNotch
  # Your releases are tagged 0.2.0, not v0.2.0; keep new ones the same.
  vPrefixedTagName: false
win:
  # nsis: the GitHub download (self-updating). appx: the Microsoft Store
  # package, uploaded to Partner Center, where Microsoft signs it.
  target:
    - nsis
    - appx
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Shown before installing; the user must accept it to continue.
  license: resources/license.txt
# The Store package. Identity values from Partner Center →
# your app → Product management → Product identity, copied exactly.
# Tile images are in resources/appx (made by scripts/make-icon.cjs).
appx:
  identityName: Devezio.DeskNotch
  publisher: CN=F35F3C2B-A4E0-4061-BA7F-5EB9B3EE1446
  publisherDisplayName: Devezio
  applicationId: DeskNotch
  displayName: DeskNotch
  backgroundColor: "#111113"
  languages:
    - en-US
  # Declares a Windows startup task: Store apps cannot register themselves
  # the way the installer does. Users switch it in Settings → Apps → Startup.
  addAutoLaunchExtension: true
# macOS: no Dock icon or app switcher entry (see main/main.ts, app.dock.hide).
mac:
  # Unsigned on purpose (no Apple account): ad hoc signed, so Homebrew's cask
  # or "Open Anyway" is how people open it. See docs/specs/0001-macos-port.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: resources/icon.icns
  category: public.app-category.utilities
  minimumSystemVersion: "13.0"
  extraResources:
    - from: native/mac/build/DeskNotchHelper.app
      to: DeskNotchHelper.app
    - from: native/mac/build/mediaremote
      to: mediaremote
  identity: "-"
  extendInfo:
    LSUIElement: true
    # macOS reads these from the app that is responsible for the helper (this
    # one), not from the helper's own plist; without them the Calendar and
    # Location prompts are refused without ever showing.
    NSCalendarsUsageDescription: DeskNotch reads your calendar to show your next events. It never changes it.
    NSCalendarsFullAccessUsageDescription: DeskNotch reads your calendar to show your next events. It never changes it.
    NSLocationUsageDescription: DeskNotch shows the name of the Wi-Fi network you join.
    NSLocationWhenInUseUsageDescription: DeskNotch shows the name of the Wi-Fi network you join.
