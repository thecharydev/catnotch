name: Release macOS

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:helper
      - run: npx nextron build --mac --universal
      # Tags are unprefixed (1.0.4), and the release is made by the Windows publish.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/latest-mac.yml --clobber
      # Bump the Homebrew cask in the tap repo. Skipped until the tap exists
      # and HOMEBREW_TAP_TOKEN (a token that can push to it) is set.
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN, skipping the cask"; exit 0; fi
          VERSION="$GITHUB_REF_NAME"
          SHA=$(shasum -a 256 dist/DeskNotch-$VERSION-universal.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-desknotch.git" tap
          mkdir -p tap/Casks
          sed -e "s/VERSION/$VERSION/" -e "s/SHA256/$SHA/" -e "s/OWNER/$OWNER/g" packaging/homebrew/desknotch.rb > tap/Casks/desknotch.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Casks/desknotch.rb
          git commit -m "desknotch $VERSION" || exit 0
          git push
