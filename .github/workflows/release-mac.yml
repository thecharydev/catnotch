name: Release macOS

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$V" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run build:helper
      # electron-builder auto publishes on a tag and wants GH_TOKEN; the step below
      # publishes with gh, so tell the build not to.
      - run: npx nextron build --mac --universal --publish never
      # Tags are unprefixed (1.0.4). The release is published (not a draft) with
      # notes from the merged PRs; CatNotch.dmg is a stable name for the README's
      # releases/latest/download link.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/CatNotch-$GITHUB_REF_NAME-universal.dmg" dist/CatNotch.dmg
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "CatNotch $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/CatNotch.dmg "dist/CatNotch-$GITHUB_REF_NAME-universal.dmg" dist/*.zip dist/latest-mac.yml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      # Bump the Homebrew cask in the tap repo. Skipped until the tap exists
      # and HOMEBREW_TAP_TOKEN (a token that can push to it) is set.
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN, skipping the cask"; exit 0; fi
          VERSION="$GITHUB_REF_NAME"
          SHA=$(shasum -a 256 dist/CatNotch-$VERSION-universal.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-desknotch.git" tap
          mkdir -p tap/Casks
          sed -e "s/VERSION/$VERSION/" -e "s/SHA256/$SHA/" -e "s/OWNER/$OWNER/g" packaging/homebrew/desknotch.rb > tap/Casks/desknotch.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Casks/desknotch.rb
          git commit -m "desknotch $VERSION" || exit 0
          git push
